version: '3.8'

services:
  vllm-rag:
    build: .
    container_name: vllm-rag-server
    ports:
      - "8004:8000"
    volumes:
      - .:/workspace
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/workspace/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    shm_size: 64g
    ulimits:
      memlock: -1
      stack: 67108864
    command: tail -f /dev/null
