# exp18: isolated cold-load batch×max_len sweep with subprocess-per-cell.
# Same Q41 corpus + 3T+A. Each case spawns a fresh process so model load is identical
# per-cell (cold) and CUDA state never leaks across cases.
#
# Risk ranking (informational): higher batch+len = higher VRAM peak, abort threshold 11500 MiB.
cases:
  # GTE — 7 cells
  - case_id: E18_gte_fp16_b32_len8192
    model_name: Alibaba-NLP/gte-multilingual-base
    embedding_dim: 768
    embedding_mode: 3T+A
    batch_size: 32
    torch_dtype: float16
    attn_implementation: sdpa

  - case_id: E18_gte_fp16_b32_len512
    model_name: Alibaba-NLP/gte-multilingual-base
    embedding_dim: 768
    embedding_mode: 3T+A
    batch_size: 32
    torch_dtype: float16
    max_seq_length: 512
    attn_implementation: sdpa

